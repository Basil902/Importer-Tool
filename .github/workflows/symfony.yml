# documentation.

name: Symfony

on:
  push:

permissions:
  contents: read

jobs:
  tests:
    name: Symfony 8.4
  
    runs-on: ubuntu-latest
  
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: app_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      APP_ENV: test
      DATABASE_URL: 'mysql://root@127.0.0.1:3306/app?serverVersion=8.0&charset=utf8mb4'
      MAILER_DSN: 'null://null'

    strategy:
      fail-fast: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Setup PHP, extensions and composer with shivammathur/setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql, gd, zip
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Security audit of dependencies
        run: composer audit

      - name: Check Symfony console
        run: bin/console about

      - name: Lint container
        run: bin/console lint:container

      - run: php bin/console importmap:install

      - name: Create Database-Schema and run Migrations 
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          php bin/console doctrine:schema:validate

      - name: Run tests
        run: make test
